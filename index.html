<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCET Mumbai ERP Portal — Group 6 PS</title>
  <style>
/* ==========================================================================
   TCET Mumbai ERP Portal — Group 6 PS
   Clean academic UI faithfully matching the 7-page rough sketch wireframes
   plus dedicated Teacher & Administrator dashboards.
   ========================================================================== */

:root {
  --bg: #eef4f8;
  --surface: #ffffff;
  --surface-soft: #f7fafc;
  --border: #cbd5e1;
  --border-strong: #1e40af;
  --text: #0f172a;
  --muted: #475569;

  /* Role-specific accent tokens */
  --student-primary: #1d4ed8;
  --student-soft: #dbeafe;
  --teacher-primary: #0f766e;
  --teacher-soft: #ccfbf1;
  --admin-primary: #b45309;
  --admin-soft: #fef3c7;

  /* Status colors */
  --present-bg: #dcfce7;
  --present-text: #166534;
  --absent-bg: #fee2e2;
  --absent-text: #991b1b;
  --cancelled-bg: #f1f5f9;
  --cancelled-text: #475569;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.12);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

button, input, select, textarea {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   LOGIN SCREEN
   ========================================================================== */
.login-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(135deg, #e0ecff 0%, #eef4f8 50%, #e6f6f4 100%);
}

.login-card {
  width: 100%;
  max-width: 960px;
  background: var(--surface);
  border-radius: 24px;
  box-shadow: var(--shadow-md);
  border: 1px solid #dbe4f0;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
}

.login-brand {
  background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 60%, #1d4ed8 100%);
  color: #ffffff;
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
}

.brand-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo-box {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: #bfdbfe;
}

.brand-hero h2 {
  margin: 0 0 10px;
  font-size: 28px;
  line-height: 1.2;
}

.brand-hero p {
  margin: 0;
  color: #dbeafe;
  font-size: 14px;
}

.demo-box {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 13px;
}

.demo-box-title {
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.demo-quick-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.demo-btn {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.demo-btn:hover {
  background: rgba(255, 255, 255, 0.28);
}

.login-form-pane {
  padding: 36px 34px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.role-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  background: #f1f5f9;
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 22px;
}

.role-tab {
  border: none;
  background: transparent;
  padding: 10px 8px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}

.role-tab.active-student {
  background: var(--student-primary);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.role-tab.active-teacher {
  background: var(--teacher-primary);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.role-tab.active-admin {
  background: var(--admin-primary);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  background: #ffffff;
  color: var(--text);
  transition: border-color 0.15s;
}

.form-input:focus {
  outline: none;
  border-color: var(--student-primary);
}

.btn-primary {
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  background: var(--student-primary);
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.93;
}

.btn-primary:active {
  transform: scale(0.99);
}

.btn-teacher {
  background: var(--teacher-primary);
}

.btn-admin {
  background: var(--admin-primary);
}

.btn-outline {
  padding: 8px 14px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: #ffffff;
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.btn-outline:hover {
  background: #f8fafc;
  border-color: #94a3b8;
}

.login-error {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #fecaca;
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 13px;
  margin-bottom: 14px;
}

.db-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: var(--radius-pill);
  background: #dcfce7;
  color: #166534;
}

.db-badge.cloud {
  background: #dbeafe;
  color: #1e40af;
}

.db-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulseDot 1.8s infinite;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.82); }
}

/* ==========================================================================
   ERP SHELL (Matching Sketch Wireframe: Top Header + Left Sidebar + Main)
   ========================================================================== */
.erp-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 230px 1fr;
  grid-template-rows: 74px 1fr;
  background: var(--bg);
}

.erp-shell.role-teacher {
  --active-primary: var(--teacher-primary);
  --active-soft: var(--teacher-soft);
}

.erp-shell.role-admin {
  --active-primary: var(--admin-primary);
  --active-soft: var(--admin-soft);
}

.erp-shell.role-student {
  --active-primary: var(--student-primary);
  --active-soft: var(--student-soft);
}

/* Top-Left Logo Cell (Sketch: square graduation cap box above sidebar) */
.erp-logo-cell {
  background: var(--surface);
  border-right: 1.5px solid var(--border);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 14px;
}

.sketch-logo-square {
  width: 46px;
  height: 46px;
  border: 2px solid var(--active-primary, #1d4ed8);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--active-primary, #1d4ed8);
  background: var(--active-soft, #dbeafe);
  flex-shrink: 0;
}

.logo-text-stack {
  display: flex;
  flex-direction: column;
}

.logo-text-stack strong {
  font-size: 14px;
  line-height: 1.1;
  color: var(--text);
}

.logo-text-stack span {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}

/* Top-Right Header Bar (Sketch: Centered Page Title + Right Profile Pill) */
.erp-topbar {
  background: var(--surface);
  border-bottom: 1.5px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-left-mobile {
  display: none;
}

.topbar-title {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: var(--active-primary, #1d4ed8);
  letter-spacing: -0.01em;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Sketch Profile Pill Button */
.profile-pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 6px 16px 6px 8px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--active-primary, #1d4ed8);
  background: #ffffff;
  color: var(--active-primary, #1d4ed8);
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.profile-pill-btn:hover {
  background: var(--active-soft, #dbeafe);
}

.profile-pill-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--active-primary, #1d4ed8);
  color: #ffffff;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Left Sidebar (Sketch: vertical menu with active item circled in pill) */
.erp-sidebar {
  background: var(--surface);
  border-right: 1.5px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav-item {
  width: 100%;
  text-align: left;
  padding: 11px 16px;
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s;
}

.nav-item:hover {
  background: #f1f5f9;
}

.nav-item.active {
  border-color: var(--active-primary, #1d4ed8);
  background: var(--active-soft, #dbeafe);
  color: var(--active-primary, #1d4ed8);
  font-weight: 700;
}

.sidebar-footer {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logout-btn {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid #fecaca;
  background: #fef2f2;
  color: #b91c1c;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}

.logout-btn:hover {
  background: #fee2e2;
}

/* Main Content Area */
.erp-main {
  padding: 24px 28px 36px;
  overflow-x: hidden;
}

/* ==========================================================================
   COMMON CARDS & WIREFRAME COMPONENTS
   ========================================================================== */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}

.card-title {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 800;
  color: var(--active-primary, #1d4ed8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* ==========================================================================
   STUDENT DASHBOARD (Sketch Page 2 Top)
   ========================================================================== */
.greeting-block {
  margin-bottom: 18px;
}

.greeting-block h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
}

.greeting-block p {
  margin: 2px 0 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 1.85fr 1fr;
  gap: 20px;
  align-items: start;
}

.dashboard-col {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Upcoming Submissions inner split */
.submissions-split {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 18px;
}

.day-sub-block {
  margin-bottom: 12px;
}

.day-sub-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 5px;
}

.day-sub-box {
  border: 1.5px solid var(--student-primary);
  background: #f8fbff;
  border-radius: 9px;
  padding: 9px 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.day-sub-box.empty {
  border-color: var(--border);
  color: var(--muted);
  background: #f8fafc;
}

.period-sub-group {
  margin-bottom: 12px;
}

.period-sub-group h4 {
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--student-primary);
}

.period-sub-row {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  padding: 4px 0;
  border-bottom: 1px dashed #e2e8f0;
}

/* Tomorrow's Timetable rows */
.tomorrow-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--surface-soft);
  margin-bottom: 8px;
  font-size: 14.5px;
}

.tomorrow-row strong {
  color: var(--text);
}

.tomorrow-row span {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--student-primary);
}

/* Attendance quick list on dashboard */
.mini-att-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 14.5px;
}

.mini-att-row:hover {
  background: var(--student-soft);
}

.pct-pill {
  font-weight: 800;
  font-size: 13.5px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
}

.pct-high { background: #dcfce7; color: #166534; }
.pct-mid  { background: #fef3c7; color: #92400e; }
.pct-low  { background: #fee2e2; color: #991b1b; }

/* Announcement pills (Dashboard + Announcements tab) */
.announcement-pill {
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--student-primary);
  background: #f8fbff;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  transition: background 0.15s, transform 0.1s;
}

.announcement-pill:hover {
  background: var(--student-soft);
  transform: translateX(2px);
}

.announcement-pill small {
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}

/* ==========================================================================
   TIME TABLE (Sketch Page 2 Bottom — with Horizontal Slider)
   ========================================================================== */
.timetable-layout {
  display: grid;
  grid-template-columns: 2.15fr 1fr;
  gap: 20px;
  align-items: start;
}

.tt-scroll-viewport {
  overflow-x: auto;
  padding-bottom: 8px;
}

.tt-grid-table {
  width: 100%;
  min-width: 720px;
  border-collapse: separate;
  border-spacing: 8px;
}

.tt-grid-table th {
  font-size: 13px;
  font-weight: 800;
  color: var(--student-primary);
  padding: 6px 8px;
  text-align: center;
}

.tt-day-cell {
  font-weight: 800;
  color: var(--text);
  font-size: 14px;
  width: 60px;
  text-align: left;
}

.tt-slot-box {
  border: 1.5px solid var(--student-primary);
  background: #f8fbff;
  border-radius: 10px;
  padding: 8px 10px;
  text-align: center;
  min-height: 54px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.tt-slot-box strong {
  font-size: 13.5px;
  color: var(--text);
}

.tt-slot-box span {
  font-size: 11px;
  color: var(--muted);
}

.tt-slot-empty {
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  min-height: 54px;
  background: #f8fafc;
}

/* Sketch Bottom Horizontal Slider */
.slider-control-bar {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--student-primary);
}

.slider-control-bar input[type="range"] {
  flex: 1;
  accent-color: var(--student-primary);
  cursor: pointer;
}

/* ==========================================================================
   ANNOUNCEMENTS (Sketch Page 3 Top)
   ========================================================================== */
.announcements-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.column-header-rule {
  font-size: 17px;
  font-weight: 800;
  color: var(--student-primary);
  padding-bottom: 10px;
  margin: 0 0 14px;
  border-bottom: 2px solid var(--student-primary);
}

/* ==========================================================================
   EXAMS (Sketch Page 3 Bottom & Page 4 Bottom)
   ========================================================================== */
.exams-layout {
  display: grid;
  grid-template-columns: 1.85fr 1fr;
  gap: 20px;
  align-items: start;
}

.exam-cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.exam-box-btn {
  border: 2px solid var(--student-primary);
  background: #f8fbff;
  border-radius: 12px;
  padding: 18px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}

.exam-box-btn:hover {
  background: var(--student-soft);
  transform: translateY(-2px);
}

.exam-box-btn.full-span {
  grid-column: 1 / -1;
}

.exam-box-label {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.exam-box-score {
  font-size: 22px;
  font-weight: 800;
  color: var(--student-primary);
}

.overall-big-card {
  text-align: center;
  padding: 24px 18px;
}

.overall-big-card .big-pct {
  font-size: 46px;
  font-weight: 900;
  color: var(--student-primary);
  line-height: 1.1;
  margin-top: 6px;
}

/* ==========================================================================
   SYLLABUS (Sketch Page 5 Top & Page 6 Top)
   ========================================================================== */
.syllabus-top-action {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.btn-pdf-view {
  border: 2px solid var(--student-primary);
  background: #ffffff;
  color: var(--student-primary);
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-pdf-view:hover {
  background: var(--student-primary);
  color: #ffffff;
}

.syllabus-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  align-items: start;
}

.clickable-table {
  width: 100%;
  border-collapse: collapse;
}

.clickable-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--student-primary);
  border-bottom: 2px solid var(--student-primary);
}

.clickable-table th.right,
.clickable-table td.right {
  text-align: right;
}

.clickable-table tbody tr {
  cursor: pointer;
  transition: background 0.15s;
}

.clickable-table tbody tr:hover {
  background: var(--student-soft);
}

.clickable-table td {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  font-size: 15px;
  font-weight: 600;
}

/* ==========================================================================
   ATTENDANCE (Sketch Page 5 Bottom & Page 6 Bottom — with Vertical Slider)
   ========================================================================== */
.attendance-main-card {
  max-width: 780px;
  margin: 0 auto;
  padding: 26px 30px;
}

.attendance-overall-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 2px solid var(--student-primary);
}

.attendance-overall-row h3 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
}

.attendance-overall-row .overall-num {
  font-size: 28px;
  font-weight: 900;
  color: var(--student-primary);
}

.attendance-subject-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 6px;
}

.attendance-subject-row:hover {
  background: var(--student-soft);
  border-color: var(--student-primary);
}

.attendance-subject-row span:first-child {
  font-size: 17px;
  font-weight: 700;
}

.attendance-subject-row span:last-child {
  font-size: 17px;
  font-weight: 800;
  color: var(--student-primary);
}

/* Attendance Detail Modal with Left Vertical Slider (Sketch Page 6 Bottom) */
.att-detail-layout {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 14px;
  align-items: stretch;
}

.vertical-slider-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  border-radius: 10px;
  padding: 10px 4px;
}

.vertical-slider-rail input[type="range"] {
  writing-mode: vertical-lr;
  direction: ltr;
  height: 240px;
  width: 24px;
  accent-color: var(--student-primary);
  cursor: pointer;
}

.att-detail-scroll {
  max-height: 290px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.status-badge {
  display: inline-block;
  padding: 4px 11px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 700;
}

.status-Present   { background: var(--present-bg); color: var(--present-text); }
.status-Absent    { background: var(--absent-bg); color: var(--absent-text); }
.status-Cancelled { background: var(--cancelled-bg); color: var(--cancelled-text); }

/* ==========================================================================
   MODAL OVERLAY & SPECIFIC MODALS (Pages 4, 6, 7)
   ========================================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.52);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-box {
  background: var(--surface);
  border: 2px solid var(--student-primary);
  border-radius: 18px;
  width: 100%;
  max-width: 660px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 26px 28px;
  box-shadow: var(--shadow-md);
  animation: modalIn 0.16s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1.5px solid var(--border);
}

.modal-header h3 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  color: var(--student-primary);
}

.modal-close-btn {
  border: 1.5px solid var(--border);
  background: #f8fafc;
  color: var(--text);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.modal-close-btn:hover {
  background: #e2e8f0;
}

/* Exam Detail Modal Grid (Sketch Page 4 Bottom: 3 top, 2 middle, 1 overall) */
.exam-detail-row-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 14px;
}

.exam-detail-row-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 420px;
  margin: 0 auto 18px;
}

.exam-sub-card {
  border: 1.5px solid var(--student-primary);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  background: #f8fbff;
}

.exam-sub-card .sub-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
}

.exam-sub-card .sub-val {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-top: 4px;
}

.exam-overall-box {
  border: 2px solid var(--student-primary);
  border-radius: 12px;
  padding: 18px;
  max-width: 280px;
  margin: 0 auto;
  text-align: center;
  background: var(--student-soft);
}

/* Profile Modal (Sketch Page 7) */
.profile-modal-grid {
  display: grid;
  grid-template-columns: 165px 1fr;
  gap: 24px;
  align-items: center;
}

.profile-avatar-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  margin: 0 auto;
}

.profile-avatar-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid var(--student-primary);
  background: var(--student-soft);
  color: var(--student-primary);
  font-size: 46px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-edit-pencil {
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid #ffffff;
  background: var(--student-primary);
  color: #ffffff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.profile-field-pill {
  border: 1.5px solid var(--student-primary);
  border-radius: 12px;
  padding: 9px 14px;
  font-size: 15px;
  font-weight: 700;
  background: #f8fbff;
  margin-bottom: 12px;
}

/* ==========================================================================
   TEACHER & ADMIN PORTAL SPECIFIC CONTROLS
   ========================================================================== */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.kpi-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
}

.kpi-card small {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.kpi-card .kpi-val {
  font-size: 28px;
  font-weight: 900;
  color: var(--active-primary);
  margin-top: 4px;
}

.toolbar-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 18px;
}

.toolbar-row .form-group {
  margin-bottom: 0;
  min-width: 160px;
  flex: 1;
}

.att-toggle-group {
  display: inline-flex;
  gap: 6px;
}

.att-toggle-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: #ffffff;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}

.att-toggle-btn.selected-Present   { background: var(--present-bg); color: var(--present-text); border-color: #16a34a; }
.att-toggle-btn.selected-Absent    { background: var(--absent-bg); color: var(--absent-text); border-color: #dc2626; }
.att-toggle-btn.selected-Cancelled { background: var(--cancelled-bg); color: var(--cancelled-text); border-color: #64748b; }

.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th, .data-table td {
  padding: 11px 12px;
  text-align: left;
  border-bottom: 1px solid #e2e8f0;
  font-size: 14px;
}

.data-table th {
  background: #f8fafc;
  font-weight: 800;
  color: var(--muted);
  font-size: 12.5px;
  text-transform: uppercase;
}

/* ==========================================================================
   TOAST NOTIFICATIONS
   ========================================================================== */
.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 1200;
  max-width: 360px;
}

.toast {
  background: #0f172a;
  color: #ffffff;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow-md);
  border-left: 4px solid #38bdf8;
  animation: toastIn 0.2s ease-out;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ==========================================================================
   RESPONSIVE BREAKPOINTS
   ========================================================================== */
@media (max-width: 900px) {
  .login-card {
    grid-template-columns: 1fr;
  }
  .erp-shell {
    grid-template-columns: 1fr;
    grid-template-rows: 64px auto 1fr;
  }
  .erp-logo-cell {
    display: none;
  }
  .erp-sidebar {
    border-right: none;
    border-bottom: 1.5px solid var(--border);
    padding: 10px 14px;
    flex-direction: row;
    overflow-x: auto;
  }
  .sidebar-nav {
    flex-direction: row;
    flex-wrap: nowrap;
  }
  .nav-item {
    white-space: nowrap;
    padding: 8px 14px;
    font-size: 13.5px;
  }
  .sidebar-footer {
    display: none;
  }
  .dashboard-grid,
  .timetable-layout,
  .announcements-grid,
  .exams-layout,
  .syllabus-layout,
  .profile-modal-grid,
  .submissions-split {
    grid-template-columns: 1fr;
  }
  .kpi-row {
    grid-template-columns: repeat(2, 1fr);
  }
  .exam-detail-row-3 {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   Real-Time Database Layer (js/database.js)
   --------------------------------------------------------------------------
   Supports TWO seamlessly integrated backend modes:
   1. Firebase Realtime Database (Cloud Mode): When a Firebase databaseURL is
      configured in js/firebase-config.js or Admin -> Database Settings, every
      save pushes JSON to Firebase via HTTPS REST API and polls live updates.
   2. Local Real-Time Sync (Instant Demo Mode): Persists data in localStorage
      and broadcasts every change across browser tabs via BroadcastChannel +
      storage events so Teacher -> Student attendance updates happen LIVE!
   ========================================================================== */

window.TCET_DB = (function () {
  const STORAGE_KEY = "tcet_erp_group6_db_v1";
  const FB_URL_KEY = "tcet_erp_firebase_url_v1";
  const CHANNEL_NAME = "tcet_erp_live_sync_channel";

  let state = null;
  let listeners = [];
  let channel = null;
  let pollTimer = null;
  let lastSavedHash = "";

  function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function getFirebaseUrl() {
    let saved = "";
    try {
      saved = localStorage.getItem(FB_URL_KEY) || "";
    } catch (e) {}
    const fromConfig = (window.TCET_FIREBASE_CONFIG && window.TCET_FIREBASE_CONFIG.databaseURL) || "";
    const url = (saved || fromConfig).trim().replace(/\/+$/, "");
    return url.startsWith("https://") ? url : "";
  }

  function setFirebaseUrl(url) {
    const clean = (url || "").trim().replace(/\/+$/, "");
    try {
      if (clean) localStorage.setItem(FB_URL_KEY, clean);
      else localStorage.removeItem(FB_URL_KEY);
    } catch (e) {}
    startFirebasePolling();
    if (clean) {
      pushToFirebase(state);
    }
    notifyListeners("Database mode updated");
  }

  function loadInitialState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (!parsed.studyTracker && window.TCET_INITIAL_DATA.studyTracker) {
          parsed.studyTracker = deepClone(window.TCET_INITIAL_DATA.studyTracker);
        }
        return parsed;
      }
    } catch (e) {}
    return deepClone(window.TCET_INITIAL_DATA);
  }

  function persistLocal(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  async function pushToFirebase(data) {
    const fbUrl = getFirebaseUrl();
    if (!fbUrl) return;
    try {
      await fetch(fbUrl + "/tcet_erp_group6.json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
    } catch (err) {
      console.warn("Firebase write skipped/offline:", err);
    }
  }

  async function pullFromFirebase() {
    const fbUrl = getFirebaseUrl();
    if (!fbUrl) return;
    try {
      const res = await fetch(fbUrl + "/tcet_erp_group6.json");
      if (!res.ok) return;
      const remote = await res.json();
      if (remote && remote.attendance && remote.users) {
        const remoteStr = JSON.stringify(remote);
        if (remoteStr !== lastSavedHash) {
          lastSavedHash = remoteStr;
          state = remote;
          persistLocal(state);
          notifyListeners("Live cloud update received from Firebase");
        }
      }
    } catch (err) {
      console.warn("Firebase poll offline:", err);
    }
  }

  function startFirebasePolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
    if (getFirebaseUrl()) {
      pullFromFirebase();
      pollTimer = setInterval(pullFromFirebase, 3000);
    }
  }

  function notifyListeners(reason) {
    listeners.forEach(function (fn) {
      try {
        fn(state, reason);
      } catch (e) {}
    });
  }

  function init() {
    state = loadInitialState();
    lastSavedHash = JSON.stringify(state);
    persistLocal(state);

    /* Real-time cross-tab sync via BroadcastChannel */
    if (typeof BroadcastChannel !== "undefined") {
      try {
        channel = new BroadcastChannel(CHANNEL_NAME);
        channel.onmessage = function (ev) {
          if (ev.data && ev.data.payload) {
            state = ev.data.payload;
            lastSavedHash = JSON.stringify(state);
            persistLocal(state);
            notifyListeners(ev.data.reason || "Live update received");
          }
        };
      } catch (e) {}
    }

    /* Fallback cross-tab sync via window storage event */
    window.addEventListener("storage", function (ev) {
      if (ev.key === STORAGE_KEY && ev.newValue) {
        try {
          state = JSON.parse(ev.newValue);
          lastSavedHash = ev.newValue;
          notifyListeners("Live update received");
        } catch (e) {}
      }
    });

    startFirebasePolling();
  }

  function getState() {
    if (!state) init();
    return state;
  }

  function saveState(mutatorFn, reason) {
    if (!state) init();
    mutatorFn(state);
    lastSavedHash = JSON.stringify(state);
    persistLocal(state);

    if (channel) {
      try {
        channel.postMessage({ payload: state, reason: reason || "Data updated" });
      } catch (e) {}
    }

    pushToFirebase(state);
    notifyListeners(reason || "Saved");
  }

  function resetDemoData() {
    state = deepClone(window.TCET_INITIAL_DATA);
    lastSavedHash = JSON.stringify(state);
    persistLocal(state);
    if (channel) {
      try {
        channel.postMessage({ payload: state, reason: "Demo data reset" });
      } catch (e) {}
    }
    pushToFirebase(state);
    notifyListeners("Demo data restored to defaults");
  }

  function subscribe(fn) {
    listeners.push(fn);
  }

  /* Helper: Get attendance logs for a specific student (falls back to shared base logs) */
  function getStudentAttendanceLogs(subjectKey, studentId) {
    const s = getState();
    const baseLogs = (s.attendance && s.attendance[subjectKey]) || [];
    if (studentId && s.attendanceByStudent && s.attendanceByStudent[studentId] && s.attendanceByStudent[studentId][subjectKey]) {
      return s.attendanceByStudent[studentId][subjectKey];
    }
    return baseLogs;
  }

  /* Helper: Compute attendance percentage for a subject (ignores Cancelled) */
  function calcSubjectAttendance(subjectKey, studentId) {
    const logs = getStudentAttendanceLogs(subjectKey, studentId);
    let present = 0;
    let conducted = 0;
    logs.forEach(function (entry) {
      if (entry.status === "Present") {
        present++;
        conducted++;
      } else if (entry.status === "Absent") {
        conducted++;
      }
    });
    return conducted === 0 ? 100 : Math.round((present / conducted) * 100);
  }

  function calcOverallAttendance(studentId) {
    const keys = Object.keys(getState().attendance || {});
    if (!keys.length) return 0;
    let total = 0;
    keys.forEach(function (k) {
      total += calcSubjectAttendance(k, studentId);
    });
    return Math.round(total / keys.length);
  }

  function calcExamOverall(examName) {
    const exam = getState().exams[examName];
    if (!exam || exam.status !== "published") return null;
    const vals = Object.values(exam.subjects).filter(function (v) {
      return typeof v === "number";
    });
    if (!vals.length) return null;
    return Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
  }

  function calcAllExamsOverall() {
    const names = Object.keys(getState().exams || {});
    const scores = [];
    names.forEach(function (n) {
      const avg = calcExamOverall(n);
      if (avg !== null) scores.push(avg);
    });
    if (!scores.length) return 0;
    return Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length);
  }

  function calcSubjectExamAverage(shortSub) {
    const exams = getState().exams || {};
    const scores = [];
    Object.keys(exams).forEach(function (name) {
      const ex = exams[name];
      if (ex.status === "published" && typeof ex.subjects[shortSub] === "number") {
        scores.push(ex.subjects[shortSub]);
      }
    });
    if (!scores.length) return 0;
    return Math.round(scores.reduce(function (a, b) { return a + b; }, 0) / scores.length);
  }

  function calcSyllabusSubjectPct(subKey) {
    const mods = (getState().syllabus && getState().syllabus[subKey]) || [];
    if (!mods.length) return 0;
    const sum = mods.reduce(function (a, m) { return a + Number(m.completion || 0); }, 0);
    return Math.round(sum / mods.length);
  }

  function calcOverallSyllabusPct() {
    const keys = Object.keys(getState().syllabus || {});
    if (!keys.length) return 0;
    const sum = keys.reduce(function (a, k) { return a + calcSyllabusSubjectPct(k); }, 0);
    return Math.round(sum / keys.length);
  }

  return {
    init: init,
    getState: getState,
    saveState: saveState,
    resetDemoData: resetDemoData,
    subscribe: subscribe,
    getFirebaseUrl: getFirebaseUrl,
    setFirebaseUrl: setFirebaseUrl,
    getStudentAttendanceLogs: getStudentAttendanceLogs,
    calcSubjectAttendance: calcSubjectAttendance,
    calcOverallAttendance: calcOverallAttendance,
    calcExamOverall: calcExamOverall,
    calcAllExamsOverall: calcAllExamsOverall,
    calcSubjectExamAverage: calcSubjectExamAverage,
    calcSyllabusSubjectPct: calcSyllabusSubjectPct,
    calcOverallSyllabusPct: calcOverallSyllabusPct
  };
})();

  function setRole(role) {
    selectedRole = role;
    loginError = "";
    window.TCET_APP.render();
  }

  function quickLogin(role) {
    selectedRole = role;
    const creds = DEMO_CREDS[role];
    attemptLogin(creds.id, creds.pass, role);
  }

  function attemptLogin(userId, password, roleOverride) {
    const role = roleOverride || selectedRole;
    const state = window.TCET_DB.getState();
    const listMap = {
      student: state.users.students,
      teacher: state.users.teachers,
      admin:   state.users.admins
    };
    const pool = listMap[role] || [];
    const found = pool.find(function (u) {
      return u.id.toLowerCase() === (userId || "").trim().toLowerCase() && u.password === password;
    });

    if (!found) {
      loginError = "Invalid ID or password for " + role + " login. Use the Quick Demo buttons on the left.";
      window.TCET_APP.render();
      return;
    }

    loginError = "";
    window.TCET_APP.setSession({ role: role, userId: found.id });
    window.TCET_APP.showToast("Signed in as " + found.name + " (" + role.toUpperCase() + ")");
  }

  function handleFormSubmit(ev) {
    ev.preventDefault();
    const idEl = document.getElementById("login-userid");
    const pwEl = document.getElementById("login-password");
    attemptLogin(idEl ? idEl.value : "", pwEl ? pwEl.value : "");
  }

  function render() {
    const isCloud = Boolean(window.TCET_DB.getFirebaseUrl());
    const creds = DEMO_CREDS[selectedRole];
    const btnClass =
      selectedRole === "teacher"
        ? "btn-primary btn-teacher"
        : selectedRole === "admin"
        ? "btn-primary btn-admin"
        : "btn-primary";

    return (
      '<div class="login-wrapper">' +
        '<div class="login-card">' +
          '<div class="login-brand">' +
            '<div class="brand-top">' +
              '<div class="brand-logo-box">' + getLogoSvg(30) + "</div>" +
              "<div>" +
                '<h1 class="brand-title">TCET Mumbai ERP</h1>' +
                '<p class="brand-sub">Thakur College of Engineering &amp; Technology</p>' +
              "</div>" +
            "</div>" +
            '<div class="brand-hero">' +
              "<h2>Group 6 PS — Unified Campus Portal</h2>" +
              "<p>Separate dashboards for Students, Faculty, and Administrators with real-time attendance sync, exam analytics, syllabus tracking, and digital circulars.</p>" +
            "</div>" +
            '<div class="demo-box">' +
              '<div class="demo-box-title">' +
                "<span>1-Click Viva Demo Login</span>" +
                '<span class="db-badge ' + (isCloud ? "cloud" : "") + '"><span class="db-dot"></span>' + (isCloud ? "Firebase Cloud" : "Live Sync Ready") + "</span>" +
              "</div>" +
              '<div style="opacity:0.9;margin-bottom:6px;">Open two tabs (Teacher + Student) to see live attendance updates!</div>' +
              '<div class="demo-quick-btns">' +
                '<button type="button" class="demo-btn" data-action="quick-login" data-role="student">Student Demo (STU202601)</button>' +
                '<button type="button" class="demo-btn" data-action="quick-login" data-role="teacher">Teacher Demo (FAC202601)</button>' +
                '<button type="button" class="demo-btn" data-action="quick-login" data-role="admin">Admin Demo (ADM202601)</button>' +
              "</div>" +
            "</div>" +
          "</div>" +

          '<div class="login-form-pane">' +
            '<h2 style="margin:0 0 6px;font-size:22px;font-weight:800;">Sign in to your Portal</h2>' +
            '<p style="margin:0 0 18px;font-size:13.5px;color:#475569;">Select your role to launch your dedicated dashboard.</p>' +
            '<div class="role-tabs">' +
              '<button type="button" class="role-tab ' + (selectedRole === "student" ? "active-student" : "") + '" data-action="select-role" data-role="student">Student</button>' +
              '<button type="button" class="role-tab ' + (selectedRole === "teacher" ? "active-teacher" : "") + '" data-action="select-role" data-role="teacher">Teacher</button>' +
              '<button type="button" class="role-tab ' + (selectedRole === "admin" ? "active-admin" : "") + '" data-action="select-role" data-role="admin">Administrator</button>' +
            "</div>" +
            (loginError ? '<div class="login-error">' + loginError + "</div>" : "") +
            '<form id="login-form">' +
              '<div class="form-group">' +
                '<label for="login-userid">' + selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1) + ' ID</label>' +
                '<input id="login-userid" class="form-input" type="text" value="' + creds.id + '" required />' +
              "</div>" +
              '<div class="form-group">' +
                '<label for="login-password">Password</label>' +
                '<input id="login-password" class="form-input" type="password" value="' + creds.pass + '" required />' +
              "</div>" +
              '<button type="submit" class="' + btnClass + '">Login as ' + selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1) + "</button>" +
            "</form>" +
            '<p style="margin:14px 0 0;font-size:12px;color:#64748b;text-align:center;">FE AI &amp; ML Division B &bull; Academic Year 2026–27</p>' +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  return {
    getLogoSvg: getLogoSvg,
    setRole: setRole,
    quickLogin: quickLogin,
    handleFormSubmit: handleFormSubmit,
    render: render
  };
})();


/* ==========================================================================
   Student Portal (js/student-portal.js)
   Strictly implements every view and clickable popup from the 7-page
   Group 6 PS Rough Sketch PDF:
   - Dashboard (Page 2 Top)
   - Time Table + Horizontal Slider + Submissions (Page 2 Bottom)
   - Announcements: Academic & Events + Detail Modal (Page 3 Top, Page 4 Top)
   - Exams: ISE 1/2/3, IE, Term Work, Practicals, End Sem + Detail Modal (Page 3 Bottom, Page 4 Bottom)
   - Syllabus + "Click to view pdf" + Subject Modules Modal (Page 5 Top, Page 6 Top)
   - Attendance + Subject Attendance Modal with Vertical Slider (Page 5 Bottom, Page 6 Bottom)
   - Profile Modal with Avatar Edit Pencil (Page 7)
   ========================================================================== */

window.TCET_STUDENT = (function () {
  let activeTab = "Dashboard";
  let currentStudentId = "";

  const TABS = [
    "Dashboard",
    "Time Table",
    "Announcements",
    "Exams",
    "Syllabus",
    "Attendance",
    "Study Timer"
  ];

  /* YPT Study Timer live state */
  let yptMode = "stopwatch"; /* "stopwatch" or "pomodoro" */
  let yptSubject = "Maths";
  let yptRunning = false;
  let yptElapsed = 0;        /* current unsaved session seconds */
  let yptPomoRemaining = 25 * 60;
  let yptInterval = null;
  let yptStartClock = "";

  function getTab() {
    return activeTab;
  }

  function setTab(tab) {
    activeTab = tab;
    window.TCET_APP.render();
  }

  function pctClass(val) {
    if (val >= 85) return "pct-high";
    if (val >= 75) return "pct-mid";
    return "pct-low";
  }

  function getStudent(userId) {
    const list = window.TCET_DB.getState().users.students;
    return list.find(function (s) { return s.id === userId; }) || list[0];
  }

  function renderDashboard(student) {
    const db = window.TCET_DB;
    const state = db.getState();

    const dailyHtml = state.submissions.daily.map(function (item) {
      const isEmpty = item.title.toLowerCase() === "nothing";
      return (
        '<div class="day-sub-block">' +

  /* ---- YPT Study Timer Helpers & View ---- */
  function fmtHMS(totalSec) {
    const s = Math.max(0, Math.floor(totalSec || 0));
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    const secs = s % 60;
    return (
      String(hrs).padStart(2, "0") + ":" +
      String(mins).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0")
    );
  }

  function fmtShortHM(totalSec) {
    const s = Math.max(0, Math.floor(totalSec || 0));
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    return hrs + "h " + String(mins).padStart(2, "0") + "m";
  }

  function getStudyData() {
    const state = window.TCET_DB.getState();
    if (!state.studyTracker) {
      state.studyTracker = JSON.parse(JSON.stringify(window.TCET_INITIAL_DATA.studyTracker));
    }
    return state.studyTracker;
  }

  function getMyTotalStudySeconds() {
    const st = getStudyData();
    const saved = Object.values(st.subjectSeconds || {}).reduce(function (a, b) {
      return a + Number(b || 0);
    }, 0);
    return saved + yptElapsed;
  }

  function updateClockDom() {
    const displayStr = yptMode === "pomodoro" ? fmtHMS(yptPomoRemaining) : fmtHMS(yptElapsed);
    const mainClock = document.getElementById("ypt-clock-display");
    if (mainClock) mainClock.textContent = displayStr;
    const focusClock = document.getElementById("ypt-focus-clock");
    if (focusClock) focusClock.textContent = displayStr;

    const st = getStudyData();
    const subSec = Number((st.subjectSeconds && st.subjectSeconds[yptSubject]) || 0) + yptElapsed;
    const subClock = document.getElementById("ypt-sub-time-" + yptSubject);
    if (subClock) subClock.textContent = fmtHMS(subSec);

    const totalEl = document.getElementById("ypt-total-today");
    if (totalEl) totalEl.textContent = fmtShortHM(getMyTotalStudySeconds());
  }

  function stopYptInterval() {
    if (yptInterval) {
      clearInterval(yptInterval);
      yptInterval = null;
    }
  }

  function yptToggleRun() {
    if (yptRunning) {
      yptRunning = false;
      stopYptInterval();
      window.TCET_APP.render();
      return;
    }
    if (!yptStartClock) {
      const now = new Date();
      yptStartClock = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    }
    yptRunning = true;
    stopYptInterval();
    yptInterval = setInterval(function () {
      yptElapsed += 1;
      if (yptMode === "pomodoro") {
        yptPomoRemaining = Math.max(0, yptPomoRemaining - 1);
        if (yptPomoRemaining === 0) {
          yptSaveSession();
          window.TCET_APP.showToast("Pomodoro complete! 25m session logged to " + yptSubject + ".");
          yptPomoRemaining = 25 * 60;
          return;
        }
      }
      updateClockDom();
    }, 1000);
    window.TCET_APP.render();
  }

  function yptSetMode(mode) {
    if (yptMode === mode) return;
    yptRunning = false;
    stopYptInterval();
    yptMode = mode;
    if (mode === "pomodoro" && yptPomoRemaining === 0) {
      yptPomoRemaining = 25 * 60;
    }
    window.TCET_APP.render();
  }

  function yptSelectSubject(subKey) {
    if (yptElapsed >= 5 && subKey !== yptSubject) {
      yptSaveSession();
    }
    yptSubject = subKey;
    window.TCET_APP.render();
  }

  function yptResetTimer() {
    yptRunning = false;
    stopYptInterval();
    yptElapsed = 0;
    yptPomoRemaining = 25 * 60;
    yptStartClock = "";
    window.TCET_APP.render();
  }

  function yptSaveSession() {
    yptRunning = false;
    stopYptInterval();
    const logged = yptElapsed;
    if (logged < 1) {
      window.TCET_APP.showToast("Start the timer first to log a study session.");
      return;
    }
    const now = new Date();
    const endClock = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    const startClock = yptStartClock || endClock;
    const sub = yptSubject;

    yptElapsed = 0;
    yptStartClock = "";
    if (yptMode === "pomodoro") yptPomoRemaining = 25 * 60;

    window.TCET_DB.saveState(function (s) {
      if (!s.studyTracker) {
        s.studyTracker = JSON.parse(JSON.stringify(window.TCET_INITIAL_DATA.studyTracker));
      }
      if (!s.studyTracker.subjectSeconds[sub]) s.studyTracker.subjectSeconds[sub] = 0;
      s.studyTracker.subjectSeconds[sub] += logged;
      s.studyTracker.sessions.unshift({
        subject: sub,
        start: startClock,
        end: endClock,
        seconds: logged
      });
    }, "Study session saved: " + sub + " (" + fmtHMS(logged) + ")");

    window.TCET_APP.showToast("Saved " + fmtHMS(logged) + " to " + sub + " study tracker!");
  }

        '<div id="ypt-focus-clock" class="ypt-clock">' + displayStr + "</div>" +
        '<p style="margin:0 0 20px;font-size:14px;color:#475569;">Stay in this distraction-free view until your study block finishes.</p>' +
        '<div class="ypt-controls">' +

  function renderStudyTimer(student) {
    const st = getStudyData();
    const subjects = ["Maths", "Chemistry", "EM", "PPS", "IIKS"];
    const displayClock = yptMode === "pomodoro" ? fmtHMS(yptPomoRemaining) : fmtHMS(yptElapsed);
    const totalSec = getMyTotalStudySeconds();
    const goalSec = Math.max(60, Number(st.dailyGoalMinutes || 240) * 60);
    const goalPct = Math.min(100, Math.round((totalSec / goalSec) * 100));

    const subjectRows = subjects.map(function (subKey) {
      const baseSec = Number((st.subjectSeconds && st.subjectSeconds[subKey]) || 0);
      const liveSec = baseSec + (yptSubject === subKey ? yptElapsed : 0);
      const isActive = yptSubject === subKey;
      return (
        '<div class="ypt-subject-row ' + (isActive ? "active" : "") + '" data-action="ypt-select-subject" data-subject="' + subKey + '">' +
          '<div class="ypt-sub-left">' +
            '<span class="ypt-play-icon">' + (isActive && yptRunning ? "&#10074;&#10074;" : "&#9654;") + "</span>" +
            "<div>" +
              "<strong>" + subKey + "</strong>" +
              '<div style="font-size:12px;color:#64748b;">' + (isActive ? (yptRunning ? "Studying now..." : "Selected subject") : "Click to switch") + "</div>" +
            "</div>" +
          "</div>" +
          '<span id="ypt-sub-time-' + subKey + '" class="ypt-sub-time">' + fmtHMS(liveSec) + "</span>" +
        "</div>"
      );
    }).join("");

    const todoItems = (st.todos || []).map(function (t) {
      return (
        '<div class="ypt-todo-item ' + (t.done ? "done" : "") + '">' +
          '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;">' +
            '<input type="checkbox" ' + (t.done ? "checked" : "") + ' data-action="ypt-toggle-todo" data-id="' + t.id + '" />' +
            '<span class="todo-title" style="font-size:14px;font-weight:600;">' + t.text + "</span>" +
          "</label>" +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<span class="pct-pill pct-high" style="font-size:11.5px;">' + t.subject + "</span>" +
            '<button type="button" class="btn-outline" style="padding:4px 8px;font-size:12px;" data-action="ypt-del-todo" data-id="' + t.id + '">&times;</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");

    const sessionRows = (st.sessions || []).slice(0, 6).map(function (ses) {
      return (
        "<tr>" +
          "<td><strong>" + ses.subject + "</strong></td>" +
          "<td>" + ses.start + " &ndash; " + ses.end + "</td>" +
          '<td class="right">' + fmtHMS(ses.seconds) + "</td>" +
        "</tr>"
      );
    }).join("");

    /* Build live sorted TCET Study Group Leaderboard */
    const groupList = (st.peers || []).map(function (p) {
      return {
        id: p.id,
        name: p.name,
        status: p.status,
        activeSubject: p.activeSubject,
        secondsToday: p.secondsToday,
        isMe: false
      };
    });
    groupList.push({
      id: student.id,
      name: student.name + " (You)",
      status: yptRunning ? "Studying" : "On Break",
      activeSubject: yptSubject,
      secondsToday: totalSec,
      isMe: true
    });
    groupList.sort(function (a, b) { return b.secondsToday - a.secondsToday; });

    const groupRows = groupList.map(function (m, idx) {
      const dotCls = m.status === "Studying" ? "ypt-status-studying" : (m.status === "On Break" ? "ypt-status-break" : "ypt-status-offline");
      return (
        '<div class="ypt-group-row ' + (m.isMe ? "is-me" : "") + '">' +
          '<div style="display:flex;align-items:center;gap:10px;">' +
            '<span class="ypt-rank-badge">#' + (idx + 1) + "</span>" +
            "<div>" +
              '<div style="font-size:14px;font-weight:700;">' + m.name + "</div>" +
              '<div style="font-size:12px;color:#64748b;"><span class="ypt-status-dot ' + dotCls + '"></span>' + (m.status === "Studying" ? "Studying " + m.activeSubject : m.status) + "</div>" +
            "</div>" +
          "</div>" +
          '<strong style="font-variant-numeric:tabular-nums;color:#1d4ed8;font-size:14px;">' + fmtShortHM(m.secondsToday) + "</strong>" +
        "</div>"
      );
    }).join("");

    const subOpts = subjects.map(function (s) {
      return '<option value="' + s + '">' + s + "</option>";
    }).join("");

    return (
      '<div class="dashboard-grid">' +
        '<div class="dashboard-col">' +
          '<div class="card">' +
            '<div class="card-title">' +
              "<span>Study Timer</span>" +
              '<div class="ypt-mode-bar">' +
                '<button type="button" class="ypt-mode-btn ' + (yptMode === "stopwatch" ? "active" : "") + '" data-action="ypt-mode" data-mode="stopwatch">Stopwatch</button>' +
                '<button type="button" class="ypt-mode-btn ' + (yptMode === "pomodoro" ? "active" : "") + '" data-action="ypt-mode" data-mode="pomodoro">Pomodoro 25m</button>' +
              "</div>" +
            "</div>" +
            '<div class="ypt-timer-stage">' +
              '<div class="ypt-active-sub-pill">' + yptSubject + " &bull; " + (yptRunning ? "Live Focus Active" : "Ready") + "</div>" +
              '<div id="ypt-clock-display" class="ypt-clock">' + displayClock + "</div>" +
              '<div class="ypt-controls">' +
                '<button type="button" class="btn-primary" data-action="ypt-toggle">' + (yptRunning ? "Pause Timer" : "Start Studying") + "</button>" +
                '<button type="button" class="btn-outline" data-action="ypt-save">Save Session</button>' +
                '<button type="button" class="btn-outline" data-action="ypt-reset">Reset</button>' +
                '<button type="button" class="btn-outline" data-action="ypt-focus">Focus Mode</button>' +
              "</div>" +
            "</div>" +
            subjectRows +
          "</div>" +

          '<div class="card">' +
            '<h3 class="card-title">Daily Study To-Do &amp; Planner</h3>' +
            '<form id="ypt-todo-form" class="toolbar-row" style="margin-bottom:14px;">' +
              '<div class="form-group" style="flex:2;"><input id="ypt-todo-text" class="form-input" placeholder="Add study task (e.g. Revise EM Friction)" required /></div>' +
              '<div class="form-group" style="flex:1;min-width:110px;"><select id="ypt-todo-sub" class="form-input">' + subOpts + "</select></div>" +
              '<div><button type="submit" class="btn-primary" style="width:auto;padding:11px 16px;font-size:13.5px;">Add Task</button></div>' +
            "</form>" +
            (todoItems || '<p style="font-size:13.5px;color:#64748b;">No study tasks yet. Add your first goal above.</p>') +

  function render(session) {

  return {

/* ==========================================================================
   Teacher Portal (js/teacher-portal.js)
   Dedicated faculty UI/UX for marking LIVE attendance (immediately synced
   to the Student Portal), entering exam marks, updating syllabus modules,
   and posting announcements & submissions.
   ========================================================================== */

window.TCET_TEACHER = (function () {
  let activeTab = "Mark Attendance";
  let selectedSubject = "Chemistry";
  let selectedDate = "23/11";
  let selectedTime = "10:30 - 11:30";
  let draftStatuses = {};

  const TABS = [
    "Mark Attendance",
    "Enter Exam Marks",
    "Syllabus Progress",
    "Announcements & Tasks"
  ];

  function setTab(tab) {
    activeTab = tab;
    window.TCET_APP.render();
  }

  function setDraftStatus(studentId, status) {
    draftStatuses[studentId] = status;
    window.TCET_APP.render();
  }

  function setAttendanceFilter(field, val) {
    if (field === "subject") selectedSubject = val;
    if (field === "date") selectedDate = val;
    if (field === "time") selectedTime = val;
    window.TCET_APP.render();
  }

  function markAllStudents(status) {
    const students = window.TCET_DB.getState().users.students || [];
    students.forEach(function (st) {
      draftStatuses[st.id] = status;
    });
    window.TCET_APP.render();
  }

  function submitLiveAttendance() {
    const db = window.TCET_DB;
    const dateVal = selectedDate || "Today";
    const timeVal = selectedTime || "10:30 - 11:30";
    let absentCount = 0;

    db.saveState(function (s) {
      if (!s.attendance) s.attendance = {};
      if (!s.attendance[selectedSubject]) s.attendance[selectedSubject] = [];
      if (!s.attendanceByStudent) s.attendanceByStudent = {};

      const baseLogs = s.attendance[selectedSubject].slice();
      (s.users.students || []).forEach(function (st) {
        const stStatus = draftStatuses[st.id] || "Present";
        if (stStatus === "Absent") absentCount++;
        if (!s.attendanceByStudent[st.id]) s.attendanceByStudent[st.id] = {};
        if (!s.attendanceByStudent[st.id][selectedSubject]) {
          s.attendanceByStudent[st.id][selectedSubject] = baseLogs.map(function (e) {
            return { date: e.date, time: e.time, status: e.status };
          });
        }
        s.attendanceByStudent[st.id][selectedSubject].push({
          date: dateVal,
          time: timeVal,
          status: stStatus
        });
      });

      const firstSt = (s.users.students || [])[0];
      const firstStatus = firstSt ? (draftStatuses[firstSt.id] || "Present") : "Present";
      s.attendance[selectedSubject].push({
        date: dateVal,
        time: timeVal,
        status: firstStatus
      });
    }, "Live Attendance: " + selectedSubject + " (" + dateVal + ") saved for all students");

    window.TCET_APP.showToast("Attendance saved LIVE for all students (" + absentCount + " absent)!");
  }

  function renderMarkAttendance() {
    const db = window.TCET_DB;
    const state = db.getState();
    const students = state.users.students;
    const subjects = ["Maths", "Chemistry", "EM", "PPS", "IIKS"];

    const subOpts = subjects.map(function (s) {
      return '<option value="' + s + '" ' + (selectedSubject === s ? "selected" : "") + ">" + s + "</option>";
    }).join("");

    const rows = students.map(function (st) {
      const current = draftStatuses[st.id] || "Present";
      return (
        "<tr>" +
          "<td><strong>" + st.rollNo + "</strong></td>" +
          "<td>" + st.name + " <small style=\"color:#64748b;\">(" + st.id + ")</small></td>" +
          "<td>" + st.branch + " - " + st.division + "</td>" +
          "<td>" +
            '<div class="att-toggle-group">' +
              '<button type="button" class="att-toggle-btn ' + (current === "Present" ? "selected-Present" : "") + '" data-action="teacher-set-att" data-student="' + st.id + '" data-status="Present">Present</button>' +
              '<button type="button" class="att-toggle-btn ' + (current === "Absent" ? "selected-Absent" : "") + '" data-action="teacher-set-att" data-student="' + st.id + '" data-status="Absent">Absent</button>' +
              '<button type="button" class="att-toggle-btn ' + (current === "Cancelled" ? "selected-Cancelled" : "") + '" data-action="teacher-set-att" data-student="' + st.id + '" data-status="Cancelled">Cancelled</button>' +
            "</div>" +
          "</td>" +
        "</tr>"
      );
    }).join("");

    return (
      '<div class="kpi-row">' +
        '<div class="kpi-card"><small>Division B Strength</small><div class="kpi-val">' + students.length + "</div></div>" +
        '<div class="kpi-card"><small>' + selectedSubject + ' Avg</small><div class="kpi-val">' + db.calcSubjectAttendance(selectedSubject) + "%</div></div>" +
        '<div class="kpi-card"><small>Overall Class Avg</small><div class="kpi-val">' + db.calcOverallAttendance() + "%</div></div>" +
        '<div class="kpi-card"><small>Live DB Sync</small><div class="kpi-val" style="font-size:18px;margin-top:10px;">Active</div></div>' +
      "</div>" +
      '<div class="card">' +
        '<h3 class="card-title">Mark Real-Time Lecture Attendance</h3>' +
        '<div class="toolbar-row">' +
          '<div class="form-group"><label>Subject</label><select id="t-att-subject" class="form-input" data-action="teacher-filter" data-field="subject">' + subOpts + "</select></div>" +
          '<div class="form-group"><label>Lecture Date</label><input id="t-att-date" class="form-input" value="' + selectedDate + '" data-action="teacher-filter" data-field="date" /></div>' +
          '<div class="form-group"><label>Time Slot</label><input id="t-att-time" class="form-input" value="' + selectedTime + '" data-action="teacher-filter" data-field="time" /></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<button type="button" class="btn-outline" data-action="teacher-mark-all" data-status="Present">All Present</button>' +
            '<button type="button" class="btn-outline" data-action="teacher-mark-all" data-status="Absent">All Absent</button>' +
            '<button type="button" class="btn-primary btn-teacher" data-action="teacher-submit-att">Submit Attendance Live</button>' +
          "</div>" +
        "</div>" +
        '<table class="data-table">' +
          "<thead><tr><th>Roll</th><th>Student</th><th>Batch</th><th>Attendance Status</th></tr></thead>" +
          "<tbody>" + rows + "</tbody>" +
        "</table>" +
      "</div>"

      return '<option value="' + n + '">' + n + "</option>";

          "</div>" +
          '<div class="toolbar-row">' +
            '<div class="form-group"><label>EM (%)</label><input id="tm-EM" class="form-input" type="number" min="0" max="100" value="90" required /></div>' +
            '<div class="form-group"><label>PPS (%)</label><input id="tm-PPS" class="form-input" type="number" min="0" max="100" value="88" required /></div>' +

  function renderSyllabusProgress() {
    const state = window.TCET_DB.getState();
    const blocks = Object.keys(state.syllabus).map(function (subKey) {
      const mods = state.syllabus[subKey].map(function (m, idx) {
        return (
          '<div style="display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #e2e8f0;">' +

/* ==========================================================================
   Main Application Controller (js/app.js)
   Manages session routing, global event delegation, modals, toasts, and
   live UI re-rendering whenever the database updates.
   ========================================================================== */

window.TCET_APP = (function () {
  let session = null;

  function setSession(newSession) {
    session = newSession;
    render();
  }

  function logout() {
    session = null;
    closeModal();
    render();
    showToast("Logged out successfully.");
  }

  function openModal(html) {
    const overlay = document.getElementById("modal-overlay");
    const box = document.getElementById("modal-box");
    if (!overlay || !box) return;
    box.innerHTML = html;
    overlay.classList.remove("hidden");
  }

  function closeModal() {
    const overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.classList.add("hidden");
  }

  function showToast(msg) {
    const container = document.getElementById("toast-container");
    if (!container) return;
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 3400);
  }

  function render() {
    const root = document.getElementById("app");
    if (!root) return;
    if (!session) {
      root.innerHTML = window.TCET_AUTH.render();
      return;
    }
    if (session.role === "student") {
      root.innerHTML = window.TCET_STUDENT.render(session);
      window.TCET_STUDENT.afterRender();
    } else if (session.role === "teacher") {
      root.innerHTML = window.TCET_TEACHER.render(session);
    } else if (session.role === "admin") {
      root.innerHTML = window.TCET_ADMIN.render(session);
    }
  }

  /* Unified Click Delegation (keeps HTML clean and guarantees every button works) */
  document.addEventListener("click", function (ev) {
    const target = ev.target.closest("[data-action]");
    if (!target) {
      if (ev.target && ev.target.id === "modal-overlay") closeModal();
      return;
    }
    const action = target.getAttribute("data-action");

    if (action === "select-role") window.TCET_AUTH.setRole(target.getAttribute("data-role"));
    else if (action === "quick-login") window.TCET_AUTH.quickLogin(target.getAttribute("data-role"));
    else if (action === "logout") logout();
    else if (action === "close-modal") closeModal();
    else if (action === "student-tab") window.TCET_STUDENT.setTab(target.getAttribute("data-tab"));
    else if (action === "teacher-tab") window.TCET_TEACHER.setTab(target.getAttribute("data-tab"));
    else if (action === "admin-tab") window.TCET_ADMIN.setTab(target.getAttribute("data-tab"));
    else if (action === "open-announcement-modal") window.TCET_STUDENT.openAnnouncementModal(target.getAttribute("data-id"));
    else if (action === "open-exam-modal") window.TCET_STUDENT.openExamModal(target.getAttribute("data-exam"));
    else if (action === "open-syllabus-modal") window.TCET_STUDENT.openSyllabusModal(target.getAttribute("data-subject"));
    else if (action === "open-syllabus-pdf") window.TCET_STUDENT.openSyllabusPdfModal();
    else if (action === "print-syllabus") window.print();
    else if (action === "open-attendance-modal") window.TCET_STUDENT.openAttendanceModal(target.getAttribute("data-subject"));
    else if (action === "open-profile-modal") window.TCET_STUDENT.openProfileModal(target.getAttribute("data-student-id"), false);
    else if (action === "toggle-profile-edit") window.TCET_STUDENT.openProfileModal(target.getAttribute("data-student-id"), target.getAttribute("data-edit") === "1");
    else if (action === "teacher-set-att") window.TCET_TEACHER.setDraftStatus(target.getAttribute("data-student"), target.getAttribute("data-status"));
    else if (action === "teacher-mark-all") window.TCET_TEACHER.markAllStudents(target.getAttribute("data-status"));
    else if (action === "teacher-submit-att") window.TCET_TEACHER.submitLiveAttendance();
    else if (action === "admin-del-ann") {
      const id = target.getAttribute("data-id");
      window.TCET_DB.saveState(function (s) {
        s.announcements = s.announcements.filter(function (a) { return a.id !== id; });
      }, "Announcement deleted");
      showToast("Announcement removed.");
    } else if (action === "ypt-toggle") {
      window.TCET_STUDENT.yptToggleRun();
    } else if (action === "ypt-toggle-focus") {
      window.TCET_STUDENT.yptToggleRun();
      window.TCET_STUDENT.yptOpenFocusModal();
    } else if (action === "ypt-save") {
      window.TCET_STUDENT.yptSaveSession();
    } else if (action === "ypt-save-close") {
      window.TCET_STUDENT.yptSaveSession();
      closeModal();
    } else if (action === "ypt-reset") {
      window.TCET_STUDENT.yptResetTimer();
    } else if (action === "ypt-focus") {
      window.TCET_STUDENT.yptOpenFocusModal();
    } else if (action === "ypt-mode") {
      window.TCET_STUDENT.yptSetMode(target.getAttribute("data-mode"));
    } else if (action === "ypt-select-subject") {
      window.TCET_STUDENT.yptSelectSubject(target.getAttribute("data-subject"));
    } else if (action === "ypt-del-todo") {
      const tid = target.getAttribute("data-id");
      window.TCET_DB.saveState(function (s) {
        if (s.studyTracker && s.studyTracker.todos) {
          s.studyTracker.todos = s.studyTracker.todos.filter(function (t) { return t.id !== tid; });
        }
      }, "Study task removed");
    } else if (action === "admin-reset-db") {
      window.TCET_DB.resetDemoData();
      showToast("All portal data restored to default seed values.");
    }
  });

  /* Unified Change / Input Delegation */
  document.addEventListener("change", function (ev) {
    const target = ev.target;
    const action = target && target.getAttribute("data-action");
    if (action === "teacher-filter") {
      window.TCET_TEACHER.setAttendanceFilter(target.getAttribute("data-field"), target.value);
    } else if (action === "ypt-toggle-todo") {
      const tid = target.getAttribute("data-id");
      window.TCET_DB.saveState(function (s) {
        if (s.studyTracker && s.studyTracker.todos) {
          const item = s.studyTracker.todos.find(function (t) { return t.id === tid; });
          if (item) item.done = Boolean(target.checked);
        }
      }, "Study task updated");
    } else if (action === "teacher-syllabus-slider") {
      const subKey = target.getAttribute("data-subject");
      const idx = Number(target.getAttribute("data-index"));
      const val = Number(target.value);
      window.TCET_DB.saveState(function (s) {
        if (s.syllabus[subKey] && s.syllabus[subKey][idx]) {
          s.syllabus[subKey][idx].completion = val;
        }
      }, "Syllabus updated: " + subKey);
      showToast(subKey + " module progress updated to " + val + "%");
    }
  });

  /* Unified Form Submit Delegation */
  document.addEventListener("submit", function (ev) {
    const form = ev.target;
    if (!form || !form.id) return;

    if (form.id === "login-form") {
      window.TCET_AUTH.handleFormSubmit(ev);
    } else if (form.id === "profile-edit-form") {
      ev.preventDefault();
      const sid = form.getAttribute("data-student-id");
      const name = document.getElementById("prof-name").value.trim();
      const age = Number(document.getElementById("prof-age").value);
      const branch = document.getElementById("prof-branch").value.trim();
      const division = document.getElementById("prof-div").value.trim();
      window.TCET_DB.saveState(function (s) {
        const st = s.users.students.find(function (u) { return u.id === sid; });
        if (st) {
          st.name = name;
          st.age = age;
          st.branch = branch;
          st.division = division;
        }
      }, "Student profile updated");
      closeModal();
      showToast("Profile updated successfully.");
    } else if (form.id === "teacher-marks-form") {
      ev.preventDefault();
      const examName = document.getElementById("tm-exam").value;
      const marks = {
        Math: Number(document.getElementById("tm-Math").value),
        Chem: Number(document.getElementById("tm-Chem").value),
        EM: Number(document.getElementById("tm-EM").value),
        PPS: Number(document.getElementById("tm-PPS").value),
        IIKS: Number(document.getElementById("tm-IIKS").value)
      };
      window.TCET_DB.saveState(function (s) {
        s.exams[examName] = { status: "published", subjects: marks };
      }, "Exam marks published: " + examName);
      showToast(examName + " marks published live to Student Portal!");
    } else if (form.id === "teacher-ann-form") {
      ev.preventDefault();
      const cat = document.getElementById("ta-cat").value;
      const title = document.getElementById("ta-title").value.trim();
      const body = document.getElementById("ta-body").value.trim();
      const contact = document.getElementById("ta-contact").value.trim();
      const today = new Date();
      const dateStr = String(today.getDate()).padStart(2, "0") + "/" + String(today.getMonth() + 1).padStart(2, "0") + "/" + today.getFullYear();
      window.TCET_DB.saveState(function (s) {
        s.announcements.unshift({
          id: "ann-" + Date.now(),
          category: cat,
          title: title,
          body: body,
          contact: contact,
          author: "Prof. Rajesh Sharma",
          date: dateStr
        });
      }, "New announcement posted: " + title);
      form.reset();
      showToast("Announcement published live!");
    } else if (form.id === "teacher-sub-form") {
      ev.preventDefault();
      const topic = document.getElementById("ts-topic").value.trim();
      const date = document.getElementById("ts-date").value.trim();
      const group = document.getElementById("ts-group").value;
      window.TCET_DB.saveState(function (s) {
        s.submissions[group].unshift({ title: topic, date: date });
        s.submissions.allList.unshift({ topic: topic, date: date });
      }, "New submission added: " + topic);
      form.reset();
      showToast("Upcoming submission added live!");
    } else if (form.id === "admin-add-student-form") {
      ev.preventDefault();
      const id = document.getElementById("as-id").value.trim();
      const name = document.getElementById("as-name").value.trim();
      const roll = document.getElementById("as-roll").value.trim();
      const div = document.getElementById("as-div").value.trim();
      window.TCET_DB.saveState(function (s) {
        s.users.students.push({
          id: id,
          password: "student123",
          name: name,
          age: 18,
          year: "FE",
          sem: "Sem I",
          branch: "AIML",
          division: div,
          rollNo: roll
        });
      }, "New student registered: " + name);
      form.reset();
      showToast("Student " + name + " added (default password: student123).");
    } else if (form.id === "admin-tt-form") {
      ev.preventDefault();
      const day = document.getElementById("att-day").value;
      const slot = document.getElementById("att-slot").value;
      const sub = document.getElementById("att-sub").value.trim();
      const fac = document.getElementById("att-fac").value.trim();
      window.TCET_DB.saveState(function (s) {
        if (!s.timetable[day]) s.timetable[day] = {};
        s.timetable[day][slot] = sub ? { subject: sub, faculty: fac || "Faculty" } : null;
      }, "Timetable updated: " + day + " " + slot);
      showToast("Timetable slot updated live!");
    } else if (form.id === "ypt-todo-form") {
      ev.preventDefault();
      const text = document.getElementById("ypt-todo-text").value.trim();
      const sub = document.getElementById("ypt-todo-sub").value;
      if (!text) return;
      window.TCET_DB.saveState(function (s) {
        if (!s.studyTracker) s.studyTracker = JSON.parse(JSON.stringify(window.TCET_INITIAL_DATA.studyTracker));
        s.studyTracker.todos.unshift({ id: "todo-" + Date.now(), subject: sub, text: text, done: false });
      }, "Study task added");
      form.reset();
      showToast("Added study task under " + sub + ".");
    } else if (form.id === "admin-fb-form") {
      ev.preventDefault();
      const url = document.getElementById("fb-url-input").value.trim();
      window.TCET_DB.setFirebaseUrl(url);
      showToast(url ? "Connected to Firebase Realtime Database!" : "Switched to Local Real-Time Sync.");
    }
  });

  /* Bootstrap Database & Subscribe for Real-Time Cross-Tab / Firebase Updates */
  function start() {
    window.TCET_DB.init();
    window.TCET_DB.subscribe(function (_state, reason) {
      render();
      if (session && session.role === "student" && reason && reason.indexOf("Live") === 0) {
        showToast(reason);
      }
    });
    render();
  }

  window.addEventListener("DOMContentLoaded", start);

  return {
    setSession: setSession,
    logout: logout,
    openModal: openModal,
    closeModal: closeModal,
    showToast: showToast,
    render: render
  };
})();

  </script>
</body>
</html>
